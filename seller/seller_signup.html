<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Signup</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            background-image: url('/assets/warehouse.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .signup-container {
            background: #ffffff;
            width: 380px;
            padding: 28px 30px;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            max-height: 90vh;
            overflow-y: auto;
        }

        /* Logo */
        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 12px;
        }

        .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            background: #f3f4f6;
            padding: 8px;
        }

        .signup-container h2 {
            text-align: center;
            color: #1f2933;
            margin-bottom: 6px;
        }

        .signup-container p {
            text-align: center;
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 18px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #374151;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .signup-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #22c55e;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
        }

        .signup-btn:hover {
            background: #16a34a;
        }

        .footer-text {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: #6b7280;
        }

        .footer-text span {
            color: #3b82f6;
            font-weight: 600;
            cursor: pointer;
        }

        .footer-text span:hover {
            text-decoration: underline;
        }
         .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 12px;
        }

        .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            background: #f3f4f6;
            padding: 8px;
        }
    </style>
</head>

<body>

    <div class="signup-container">
 <div class="logo-container">
            <img src="/assets/dukan (1).png" alt="Dukan Logo" class="logo">
        </div>

        <h2>Create Account</h2>
        <p>Register as a Seller</p>

        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Ali Khan">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="ali@gmail.com">
        </div>

        <div class="form-group">
            <label for="phone">Phone</label>
            <input type="text" id="phone" placeholder="0301-1234567">
        </div>

        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" placeholder="Lahore">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="********">
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="********">
        </div>

        <button class="signup-btn" onclick="signupSeller()">Create Account</button>

        <div class="footer-text">
            Already have an account?
            <span onclick="goToLogin()">Login</span>
        </div>

    </div>

    <script>
        function goToLogin() {
            window.location.href = "seller_login_page.html";
        }

        function signupSeller() {
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const address = document.getElementById("address").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (!name || !email || !phone || !address || !password || !confirmPassword) {
                alert("Please fill in all fields.");
                return;
            }

            if (password !== confirmPassword) {
                alert("Passwords do not match.");
                return;
            }

            alert("Account created successfully!");
            window.location.href = "seller_login_page.html";
        }
    </script>

</body>
</html>
