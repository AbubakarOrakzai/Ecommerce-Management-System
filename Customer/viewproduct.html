<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View Product</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    background: #f3f4f6;
}

/* NAVBAR */
.navbar {
    background: linear-gradient(135deg, #1f2933, #3b82f6);
    padding: 15px 30px;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.navbar h2 {
    font-size: 20px;
}

.navbar button {
    background: white;
    color: #1f2933;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
}

/* CONTAINER */
.product-container {
    max-width: 900px;
    margin: 40px auto;
    background: white;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    padding: 30px;
    display: flex;
    gap: 30px;
}

/* PRODUCT IMAGE */
.product-image {
    flex: 1;
}

.product-image img {
    width: 100%;
    height: 300px;
    object-fit: cover;
    border-radius: 12px;
}

/* PRODUCT DETAILS */
.product-details {
    flex: 1;
}

.product-details h2 {
    color: #1f2933;
    margin-bottom: 10px;
}

.price {
    font-size: 22px;
    color: #16a34a;
    font-weight: 700;
    margin-bottom: 15px;
}

.description {
    color: #6b7280;
    line-height: 1.6;
    margin-bottom: 25px;
}

/* BUTTONS */
.buttons {
    display: flex;
    gap: 15px;
}

.add-btn {
    background: #22c55e;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
}

.home-btn {
    background: #3b82f6;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
}

.add-btn:hover {
    background: #16a34a;
}

.home-btn:hover {
    background: #2563eb;
}
 .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 12px;
        }

        .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            background: #f3f4f6;
            padding: 8px;
        }
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
     <div class="logo-container">
            <img src="/assets/dukan (1).png" alt="Dukan Logo" class="logo">
        </div>
    <h2>E-Commerce Store</h2>
    <button onclick="goHome()">Home</button>
</div>

<!-- PRODUCT VIEW -->
<div class="product-container">

    <!-- IMAGE -->
    <div class="product-image">
        <img src="https://via.placeholder.com/500" alt="Product Image">
    </div>

    <!-- DETAILS -->
    <div class="product-details">
        <h2 id="productName">Product Name</h2>
        <div class="price">Rs. <span id="productPrice">0</span></div>

        <div class="description">
            This product is made with premium quality materials and offers excellent
            performance. It is highly recommended for daily use and long-term reliability.
        </div>

        <div class="buttons">
            <button class="add-btn" onclick="addToCart()">Add to Cart</button>
            <button class="home-btn" onclick="goHome()">Go Back to Home</button>
        </div>
    </div>

</div>

<script>
/* GET DATA FROM URL */
const params = new URLSearchParams(window.location.search);
const productName = params.get("name");
const productPrice = params.get("price");

/* DISPLAY DATA */
document.getElementById("productName").innerText = productName || "Product";
document.getElementById("productPrice").innerText = productPrice || "0";

/* ADD TO CART (FRONTEND DEMO) */
function addToCart() {
    alert(productName + " added to cart!");
}

/* GO BACK TO HOME */
function goHome() {
    window.location.href = "home.html";
}
</script>

</body>
</html>
