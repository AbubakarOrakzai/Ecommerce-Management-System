<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Commerce | Home</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    background: #f3f4f6;
}

/* NAVBAR */
.navbar {
    background: linear-gradient(135deg, #1f2933, #3b82f6);
    padding: 15px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: white;
}

.logo {
    font-size: 22px;
    font-weight: 600;
}

.nav-links {
    display: flex;
    gap: 20px;
    align-items: center;
}

.nav-links a {
    color: white;
    text-decoration: none;
    font-size: 15px;
}

.cart-icon {
    cursor: pointer;
    font-size: 16px;
}

/* SEARCH */
.search-section {
    display: flex;
    justify-content: center;
    padding: 18px;
}

.search-section input {
    width: 360px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #d1d5db;
}

/* TITLE */
.page-title {
    text-align: center;
    margin-bottom: 30px;
}

.page-title h2 {
    color: #1f2933;
}

.page-title p {
    color: #6b7280;
}

/* PRODUCTS */
.products {
    padding: 0 30px 50px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
}

.product-card {
    background: white;
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    text-align: center;
}

.product-card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 12px;
}

.product-name {
    margin: 10px 0 5px;
    font-size: 16px;
    color: #1f2933;
}

.price {
    color: #16a34a;
    font-weight: 600;
    margin-bottom: 10px;
}

.product-card button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: #3b82f6;
    color: white;
    font-weight: 600;
    cursor: pointer;
}

/* VIEW PRODUCT BUTTON */
.view-btn {
    margin-top: 8px;
    background: #64748b;
}

.view-btn:hover {
    background: #475569;
}

/* CART SIDEBAR */
.cart-panel {
    position: fixed;
    right: -350px;
    top: 0;
    height: 100%;
    width: 320px;
    background: white;
    box-shadow: -4px 0 20px rgba(0,0,0,0.2);
    padding: 20px;
    transition: 0.4s;
    z-index: 1000;
}

.cart-panel.active {
    right: 0;
}

.cart-panel h3 {
    margin-bottom: 15px;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    font-size: 14px;
}

.total {
    font-weight: 700;
    margin-top: 15px;
}

.checkout-btn {
    width: 100%;
    margin-top: 15px;
    padding: 10px;
    background: #22c55e;
    border: none;
    color: white;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
}

/* GO BACK HOME BUTTON */
.home-btn {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    background: #3b82f6;
    border: none;
    color: white;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
}

.home-btn:hover {
    background: #2563eb;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">E-Commerce Store</div>
    <div class="nav-links">
        <a href="customer-dashboard.html">Dashboard</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
        <span class="cart-icon" onclick="toggleCart()">🛒 Cart (<span id="cartCount">0</span>)</span>
    </div>
</div>

<!-- SEARCH -->
<div class="search-section">
    <input type="text" placeholder="Search products..." onkeyup="searchProduct(this.value)">
</div>

<!-- TITLE -->
<div class="page-title">
    <h2>Featured Products</h2>
    <p>Browse our latest collection</p>
</div>

<!-- PRODUCTS -->
<div class="products">

    <div class="product-card">
        <img src="Mac front pic.png">
        <div class="product-name">Macbook Air 2</div>
        <div class="price">Rs. 285,000 </div>
        <button onclick="addToCart('Dell precision 5570', 115000)">Add to Cart</button>
    <button class="view-btn"
onclick="viewProduct('Macbook Air 2', 285000)">
    View Product
</button>
       
    </div>

    <div class="product-card">
        <img src="https://via.placeholder.com/300">
        <div class="product-name">Smart Watch</div>
        <div class="price">6200</div>
        <button onclick="addToCart('Smart Watch', 6200)">Add to Cart</button>
         <button class="view-btn" onclick="viewProduct('Mobile Phone', 32000)">
            View Product
        </button>
    </div>

    <div class="product-card">
        <img src="https://via.placeholder.com/300">
        <div class="product-name">Mobile Phone</div>
        <div class="price">32000</div>
        <button onclick="addToCart('Mobile Phone', 32000)">Add to Cart</button>
        <button class="view-btn" onclick="viewProduct('Mobile Phone', 32000)">
            View Product
        </button>
    </div>

    <div class="product-card">
        <img src="https://via.placeholder.com/300">
        <div class="product-name">Laptop Bag</div>
        <div class="price">2800</div>
        <button onclick="addToCart('Laptop Bag', 2800)">Add to Cart</button>
         <button class="view-btn" onclick="viewProduct('Mobile Phone', 32000)">
            View Product
        </button>
    </div>

</div>

<!-- CART PANEL -->
<div class="cart-panel" id="cart">
    <h3>Your Cart</h3>
    <div id="cartItems"></div>

    <div class="total">
        Total: Rs. <span id="totalAmount">0</span>
    </div>

    <button class="checkout-btn">Checkout</button>
    <button class="home-btn" onclick="goBackHome()">Go Back to Home</button>
    
</div>

<script>
let cart = [];
let total = 0;

function toggleCart() {
    document.getElementById("cart").classList.toggle("active");
}

/*  ==== add to cart function =======*/

function addToCart(name, price) {
    cart.push({ name, price });
    total += price;

    document.getElementById("cartCount").innerText = cart.length;
    document.getElementById("totalAmount").innerText = total;

    let item = document.createElement("div");
    item.className = "cart-item";
    item.innerHTML = `<span>${name}</span><span>Rs. ${price}</span>`;
    document.getElementById("cartItems").appendChild(item);

    // 🔥 AUTO OPEN CART
    document.getElementById("cart").classList.add("active");
}

function searchProduct(value) {
    value = value.toLowerCase();
    let cards = document.getElementsByClassName("product-card");

    for (let card of cards) {
        let name = card.querySelector(".product-name").innerText.toLowerCase();
        card.style.display = name.includes(value) ? "block" : "none";
    }
}

function goBackHome() {
    document.getElementById("cart").classList.remove("active");
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* VIEW PRODUCT FUNCTION */
function viewProduct(name, price) {
    window.location.href =
        "view_product.html?name=" + encodeURIComponent(name) +
        "&price=" + price;
}


</script>

</body>
</html>
